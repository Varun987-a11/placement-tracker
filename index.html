<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Placement Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a73e8">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e3e7ee;--pri:#1a73e8;--sh:0 1px 2px #0000000d,0 4px 14px #0000000a;--r:14px}
:root:not([data-x]){color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--tx:#eceff4;--mut:#98a1b0;--bd:#262c38;--sh:0 1px 2px #0006}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:150px}
body{margin:0;font:clamp(14px,1.2vw + 11px,16px)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:0 0 calc(96px + env(safe-area-inset-bottom));padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
body.lock{overflow:hidden}
.wrap{width:min(1280px,100%);margin:0 auto;padding-inline:clamp(12px,3vw,28px)}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--bd)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(18px,2.4vw + 10px,26px);letter-spacing:-.02em;flex:1 1 auto;min-width:0}
#sync{font-size:12px;color:var(--mut);max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sync.err{color:#d93025}
.ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer;display:grid;place-items:center;flex:none}
.ic:active{transform:scale(.93)}
.ic.spin{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tools{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus,button:focus-visible,.chip:focus-visible,.card:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
#q{flex:1 1 220px}

/* Filter chips rows */
.filter-row{display:flex;gap:8px;overflow-x:auto;padding:6px 0;scrollbar-width:none;scroll-snap-type:x proximity;margin-inline:calc(-1*clamp(12px,3vw,28px));padding-inline:clamp(12px,3vw,28px)}
.filter-row::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:7px;min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:13.5px;user-select:none;color:var(--tx)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,#888)}
.chip b{font-weight:600;color:var(--mut);font-size:12px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip.on b{color:inherit;opacity:.8}

#list{display:grid;gap:clamp(8px,1.6vw,16px);grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));padding-top:clamp(10px,2vw,18px)}
.card{container-type:inline-size;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--c,#888);border-radius:var(--r);padding:14px;cursor:pointer;box-shadow:var(--sh);transition:transform .12s,box-shadow .12s;text-align:left}
.card:hover{transform:translateY(-2px)}
.card:active{transform:scale(.99)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.co{font-size:1.08em;font-weight:650;overflow-wrap:anywhere}
.card.el .co{text-decoration:line-through;color:#d93025}
.role{color:var(--mut);font-size:.9em;margin-top:2px}
.badge{color:#fff;font-size:.78em;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;background:var(--c,#888)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:12px 0 0}
.meta div{min-width:0}
.meta dt{font-size:.72em;color:var(--mut)}
.meta dd{margin:0;font-size:.9em;overflow-wrap:anywhere}
@container(min-width:420px){.meta{grid-template-columns:repeat(3,1fr)}}
.next{margin-top:12px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--c,#888) 12%,transparent);font-size:.88em}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:56px 12px}
.skel{height:150px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),var(--bd),var(--card));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
#fab{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));min-width:56px;height:56px;padding:0 20px;border-radius:99px;border:0;background:var(--pri);color:#fff;font:600 16px system-ui;display:flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 6px 20px #1a73e866;cursor:pointer;z-index:6}
#fab span{font-size:26px;line-height:1}
#fab em{font-style:normal;display:none}
@media(min-width:700px){#fab em{display:inline}}
#fab:active{transform:scale(.95)}
dialog{border:0;padding:0;background:var(--bg);color:var(--tx);border-radius:20px;width:min(680px,94vw);max-height:min(92dvh,900px);box-shadow:0 20px 60px #0007;overflow:hidden}
dialog[open]{display:flex;flex-direction:column;animation:pop .18s ease-out}
dialog::backdrop{background:#0008;backdrop-filter:blur(2px)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 12px 20px;border-bottom:1px solid var(--bd);background:var(--card)}
.dh h3{margin:0;font-size:1.1em}
#x{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);color:var(--tx);font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center;flex:none}
#x:hover{background:var(--bd)}
#fields{padding:6px 20px 16px;overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
#fields .full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
.btns{display:flex;gap:10px;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);background:var(--card)}
.btns button{flex:1;min-height:48px;border-radius:12px;border:0;font:600 16px system-ui;cursor:pointer}
#save{background:var(--pri);color:#fff}
#save:disabled{opacity:.6}
#cancel{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#20242c;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center;font-size:14px}
#toast.on{opacity:1}
@media(max-width:600px){
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:94dvh}
  dialog[open]{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(100%)}}
  #fields{grid-template-columns:1fr}
  #fab{right:16px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <h1>Placement Tracker</h1>
    <span id="sync">…</span>
    <button class="ic" id="refresh" aria-label="Refresh">&#x21bb;</button>
  </div>
  <div class="tools"><input id="q" type="search" placeholder="Search company, role, notes" autocomplete="off"></div>
  
  <!-- Campus Type Filter Row -->
  <div id="campus-chips" class="filter-row" style="padding-top:10px; padding-bottom:4px;"></div>

  <!-- Status Filter Row -->
  <div id="chips" class="filter-row" style="padding-top:4px; padding-bottom:10px;"></div>
</div></header>

<main class="wrap"><div id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></main>
<button id="fab" aria-label="Add application"><span>+</span><em>Add application</em></button>

<dialog id="dlg" aria-labelledby="dt">
  <div class="dh"><h3 id="dt"></h3><button id="x" aria-label="Close" type="button">&times;</button></div>
  <div id="fields"></div>
  <div class="
